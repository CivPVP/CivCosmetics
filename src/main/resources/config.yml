prefix: "&b&lCIV&f&lPVP"
store-url: "https://civpvp.net/store"
lore-editor-url: "https://civpvp.net/lore-editor"
prefix-max-length: 16
trim-cooldown-hours: 12
trim-enforcement: true

mysql:
  enabled: true
  host: "localhost"
  port: 3306
  dbname: "minecraft"
  username: "minecraft"
  password: ""
  use-ssl: false
  connection-timeout-ms: 5000
  import-yaml-on-enable: true

lore:
  max-lines: 30
  max-total-characters: 4096
  # Custom name/lore may only be applied to a single item, not a stack (stops mass-forging stackables).
  allow-stacks: false
  # Text that other plugins use to identify items. A custom name or lore line containing any entry is refused.
  # Matching ignores case, colour codes, whitespace and invisible characters.
  denied-text:
    - "Compacted"                    # FactoryMod decompact_stack.compact_lore (decompaction dupe)
    - "Crate"                        # FactoryMod compaction crate input
    - "Factory Repair Kit"           # FactoryMod repair kit name
    - "Repairs FactoryMod factories" # FactoryMod repair kit lore
    - "Printing Plate"               # FactoryMod printing plate name
    - "Bastion"                      # Bastion block names and lore
    - "This bastion will protect"    # Bastion block lore
    - "civstats-sword"               # CivStats sword-lore marker

# Limits on text that players write themselves and that other players see (/settitle, /setkillmsg).
# Matching uses the same rules as lore.denied-text. /titleadmin is not restricted.
moderation:
  kill-message-max-length: 100   # visible characters, colour codes not counted
  denied-text:
    - "Admin"
    - "Staff"
    - "Moderator"
    - "Owner"
    - "[Mod]"
    - "[OP]"
    - "[Dev]"
    - "[Helper]"
    - "[Server]"

# How often each server checks whether another server changed an online player's grants, lore credits or
# tokens (store delivery, refund, token redemption, staff grant). One indexed query per check for all players.
entitlement-refresh-seconds: 15

# Store wording shown on locked cosmetics. Ranks themselves are LuckPerms groups that grant
# civ.cosmetic.rarity.<rarity>, civ.cosmetic.trim.all, civ.cosmetic.title.all and civ.cosmetic.killmsg.all.
store:
  rarity-ranks:
    common: "&7Iron"
    rare: "&bDiamond"
    epic: "&dNetherite"
    legendary: "&dNetherite"
  perk-ranks:
    title: "&bDiamond"
    trim: "&bDiamond"
    killmsg: "&dNetherite"

# Optional rarity overrides for built-in cosmetics: <category>.<id>: common|rare|epic|legendary
# Categories: killeffects, trails, tags. Founder cosmetics stay Founder-exclusive.
cosmetic-rarities: {}

# Minimum time between kill-effect / trail previews from the GUI, per player.
preview-cooldown-ms: 3000

weapon-link:
  enabled: true
  fallback-local-range: 1000
  # Minimum time between /link uses, per player.
  cooldown-seconds: 10
  crafted-by:
    enabled: true
    show-in-lore: true
    show-in-hover: true
    line-format: "&7Crafted by: &b{name}"
  slayer-of:
    enabled: true
    show-in-lore: true
    show-in-hover: true
    visible-lines: 5
    hover-limit: 50
    line-format: "&7Slayer of &c{name}"
    more-format: "&8and {count} more"
  allowed-materials:
    - WOODEN_SWORD
    - STONE_SWORD
    - IRON_SWORD
    - GOLDEN_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD

kill-effect-sounds:
  enabled: true
  volume: 0.55
  preview-volume: 0.35

trails:
  max-ticks: 200
  max-active-per-player: 2
  max-active-global: 60
  stuck-velocity-threshold: 0.03
  stuck-ticks-before-stop: 5

# Presets are meant for small supporter groups where one click should grant
# a whole package. Use "all" when the perk should unlock an entire category.
grant-presets:
  supporter:
    display: "&6&lSupporter Package"
    icon: "GOLD_INGOT"
    lore-credits: 3
    grants:
      title:
        - "all"
      tags:
        - "champion"
        - "knight"
        - "lucky"
        - "veteran"
      trails:
        - "hearts"
        - "flame"
        - "music"
      killeffects:
        - "firework"
        - "snow"
        - "wealth"
      killmsg:
        - "all"
      lore:
        - "item"
  patreon:
    display: "&d&lPatreon Full Cosmetics"
    icon: "NETHER_STAR"
    lore-credits: 1
    grants:
      title:
        - "all"
      tags:
        - "all"
      trails:
        - "all"
      killeffects:
        - "all"
      trim:
        - "all"
      killmsg:
        - "all"
      lore:
        - "item"
